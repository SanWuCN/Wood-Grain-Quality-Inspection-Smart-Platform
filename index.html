<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      站点图标 = 团队标识（品牌蓝圆角底 + 白色符号，见 public/brand/favicon-*.png）。
      SVG 给现代浏览器，PNG 兜底 16/32 两档；Apple / Windows 磁贴用 180px 那张。
      素材全部在 public/brand/ 下，路径不带哈希 —— 换图要同步改这里。
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <meta name="msapplication-TileImage" content="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020711" />
    <meta name="description" content="木脉智检古建筑智能巡检平台演示" />
    <title>木脉智检 · 古建筑智能巡检平台</title>
    <!--
      首屏加载态（用户报「刚打开网页还是有四五秒蓝屏」）。

      为什么必须写在这里：原来加载遮罩是挂在 `mapDemo` 组件里的，
      而那个组件本身就是加载慢的东西 —— 在它挂载之前，页面上**什么都没有**，
      连顶栏都没有（用户截图里就是这个状态）。实测 t=2s 时
      `document.querySelector(".map-veil")` 是 null。

      这段标记与样式**内联在 HTML 里**，不经过任何 JS 模块：浏览器首屏就画出来，
      底圈圈从第一帧就在转。React 挂载时 `createRoot().render()` 会替换
      `#root` 的子节点，这段自动消失，不需要额外清理代码。
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #04070f;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 45% at 50% 52%, rgba(28, 52, 88, 0.55), transparent 70%),
          #04070f;
      }
      #boot .core {
        display: grid;
        justify-items: center;
        gap: 10px;
      }
      /*
        团队 logo：整条字标（含符号），在 .core 里居中（justify-items:center），
        转圈退到 logo 下面当进度指示 —— 原来只有三个空环，看不出这是哪个平台。
        与 React 的加载页（LoadingVeil / .map-veil）同一套素材与尺寸。
      */
      #boot .wordmark {
        display: block;
        width: auto;
        height: 46px;
        margin-bottom: 16px;
        opacity: 0.96;
        filter: drop-shadow(0 0 18px rgba(120, 158, 255, 0.35));
      }
      #boot .rings {
        position: relative;
        display: block;
        width: 96px;
        height: 96px;
        margin-bottom: 6px;
      }
      #boot .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(143, 194, 255, 0.34);
      }
      #boot .ring.outer {
        border-color: transparent;
        border-top-color: #8fc2ff;
        border-right-color: rgba(143, 194, 255, 0.5);
        animation: bootspin 2.6s linear infinite;
      }
      #boot .ring.mid {
        inset: 16px;
        border-style: dashed;
        border-color: rgba(143, 194, 255, 0.28);
        animation: bootspin 4.2s linear infinite reverse;
      }
      #boot .ring.inner {
        inset: 34px;
        border-color: rgba(143, 194, 255, 0.5);
        animation: bootpulse 1.8s ease-in-out infinite;
      }
      #boot b {
        color: #e8f3ff;
        font: 600 20px/1.2 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
        letter-spacing: 0.22em;
      }
      #boot .ascii {
        color: #5d7ea8;
        font: 13px/1.2 ui-monospace, Consolas, monospace;
        letter-spacing: 0.34em;
      }
      #boot .line {
        position: relative;
        display: block;
        width: 168px;
        height: 1px;
        overflow: hidden;
        background: rgba(143, 194, 255, 0.16);
      }
      #boot .line::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        background: linear-gradient(90deg, transparent, #8fc2ff, transparent);
        animation: bootsweep 1.15s ease-in-out infinite;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes bootpulse {
        0%,
        100% {
          transform: scale(0.86);
          opacity: 0.45;
        }
        50% {
          transform: scale(1.06);
          opacity: 0.95;
        }
      }
      @keyframes bootsweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(240%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring,
        #boot .line::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="core">
          <!--
            首屏加载态用团队 logo（原图抠掉蓝底后的透明 PNG，整条字标含符号）。
            `#boot` 在 React 挂载前就画出来，所以这里只能写死路径 ——
            资源放在 `public/brand/`，路径不带哈希；改文件名要同步这里。
          -->
          <img class="wordmark" src="/brand/mumai-wordmark-white.png" alt="木脉智检" />
          <span class="rings" aria-hidden="true">
            <i class="ring outer"></i>
            <i class="ring mid"></i>
            <i class="ring inner"></i>
          </span>
          <span class="ascii">MAP INITIALIZING</span>
          <i class="line"></i>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
